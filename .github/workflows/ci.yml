name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        shell: bash
        run: |
          # Inline, a non-empty file list is swallowed by the substitution and
          # the step fails with nothing in the log. Capture it, then print it.
          out=$(gofmt -l .) || status=$?
          status=${status:-0}
          echo "gofmt -l . exit status: ${status}"
          if [ -n "${out}" ]; then
            echo "gofmt reported these unformatted files:"
            echo "${out}"
          fi
          [ "${status}" -eq 0 ] && [ -z "${out}" ]
      - run: go test ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
