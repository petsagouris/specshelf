schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
context: |
  specshelf is a Go port and superset of agent-spec-vault (Python, MIT,
  github.com/xixifast/agent-spec-vault, v0.1.2). It stores durable specs,
  cross-repo contracts and ADR-style decisions as Markdown files under a
  user-level vault directory.

  Non-negotiable constraints:
  - Vault-format compatibility is the primary constraint: directory layout,
    document bytes and document ids must stay interchangeable with the Python
    tool in both directions. Every intentional divergence must be listed and
    covered by a conformance test.
  - Pure one-shot CLI. No daemon, no background process, no filesystem watcher,
    no HTTP listener.
  - Distribution is `go install github.com/petsagouris/specshelf/cmd/specshelf@version`
    only. No release artifacts, no goreleaser, no code signing or notarization,
    no Homebrew/Scoop/winget manifests.
  - Must build and run on Linux, macOS and Windows; CI runs the test suite on
    all three.
  - Runtime dependencies stay minimal: spf13/cobra, golang.org/x/text,
    pelletier/go-toml/v2 and charm.land/bubbletea/v2 (+ charm.land/bubbles/v2).
    Adding any other runtime dependency requires an explicit decision.
  - The library imports are charm.land/..., not github.com/charmbracelet/...:
    the github.com v2 paths do not compile.
  - Channel-locked releases do not exist, so nothing may depend on release
    assets, checksums or signatures.
  - License is MIT and retains the upstream copyright notice (this is a derived
    work).

rules:
  proposal:
    - State the vault-format compatibility impact of the change.
    - State explicitly what is out of scope.
  tasks:
    - Group tasks by milestone (M0..M5) and state each milestone's definition of done.
    - Every feature task that mutates the vault says which vault API it calls.
  design:
    - Name the package that owns each new behavior; a second write path is not acceptable.
